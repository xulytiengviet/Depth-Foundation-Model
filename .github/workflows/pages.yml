name: Trang mô phỏng DeFM tiếng Việt
on:
  push:
    branches: [main]
    paths: ['index.html', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra JavaScript
        run: node --check docs/app.js
      - uses: actions/configure-pages@v5
      - name: Đóng gói hai đường dẫn từ cùng một nguồn
        run: |
          mkdir -p _site/docs
          cp index.html _site/index.html
          cp -R docs/. _site/docs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Xuất bản
        id: deployment
        uses: actions/deploy-pages@v4
